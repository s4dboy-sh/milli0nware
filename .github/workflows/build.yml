name: Build Millionware DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fix broken path in project file
      run: |
        (Get-Content sdk/sdk.vcxproj) -replace 'engine\\debug\\debug_overlay.cpp', 'sdk\engine\debug\debug_overlay.cpp' | Set-Content sdk/sdk.vcxproj
      shell: powershell

    - name: Fix broken include paths in code files
      run: |
        Get-ChildItem -Recurse -Include *.cpp, *.h | ForEach-Object {
            $content = Get-Content $_.FullName
            $content = $content -replace 'engine/debug/debug_overlay.h', 'sdk/engine/debug/debug_overlay.h'
            $content = $content -replace '\.\./engine/debug/debug_overlay.h', '../sdk/engine/debug/debug_overlay.h'
            $content | Set-Content $_.FullName
        }
      shell: powershell

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild millionware.sln /p:Configuration="beta debug" /p:Platform=x86

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: millionware-dll
        path: |
          **/*.dll
          !**/dep/**
